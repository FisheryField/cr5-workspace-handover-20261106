[DataSvr]
#data svr
datasvr_data_port = 22000
datasvr_lua_port = 12346
datasvr_debug_port = 11000

#broadcast
broadcast_port=6000
broadcast_msg=dobotM1_
broadcast_chkmsg=WhoisDobotM1

# M4 serial tiemout
timeout=3

# buffer
buffer_size=8
packet_size=20
debug_size = 1200

eth0_ip=192.168.0.1
eth0_mask=255.255.255.0
eth0_gw=192.168.0.1
eth0_dns=202.96.134.133

[Scara_Framewrok]
posZero1=1
posZero1=2
posZero1=3
posZero1=4

[SerialSvr]
ttylist=/dev/ttymxc4
buffer_size=8
packet_size=20
speed=115200
bits=8
event=N
stop=1

[UdpSvr]
port=12345
maxclient=10
buffer_size=8
packet_size=20
